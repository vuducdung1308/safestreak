name: Unzip SafeStreak
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit extracted files
        run: |
          unzip -o safestreak.zip
          cp -a safestreak-export/. .
          rm -rf safestreak.zip safestreak-export
          git config user.name "vuducdung1308"
          git config user.email "vuducdung1308@gmail.com"
          git add -A
          git commit -m "SafeStreak mainnet - initial upload, contract 0xA1D5E01B04B6c8d398219bc84F5b2f28e295b28F"
          git push
